name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v3.0.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: false
        type: boolean
      force_update:
        description: Force clients to upgrade to this release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:dist:win
            artifact: desktop-windows
          - os: macos-latest
            script: desktop:dist:mac
            artifact: desktop-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/teacher-workbench-release.jks
          printf 'storeFile=teacher-workbench-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag }}
          name: 英语教师教学工作台 ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*

      - name: Prepare R2 release files
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p r2-assets
          cp "$(find release-assets -type f -name '*Setup*.exe' | head -n 1)" "r2-assets/teacher-workbench-windows.exe"
          cp "$(find release-assets -type f -name '*.dmg' | head -n 1)" "r2-assets/teacher-workbench-macos.dmg"
          cp "$(find release-assets -type f -name 'app-release.apk' | head -n 1)" "r2-assets/teacher-workbench-android.apk"
          RELEASE_VERSION="$version" FORCE_UPDATE="$FORCE_UPDATE" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const force = process.env.FORCE_UPDATE === 'true';
          const base = 'https://fff-file-r2-cloudflare.xmoj-script.uk';
          const sourcePath = 'teacher-workbench/frontend/app-update.json';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const sourceNotes = (platform) => {
            const notes = source.platforms?.[platform]?.notes;
            return Array.isArray(notes) && notes.length ? notes : [`${platform} release ${version}`];
          };
          const manifest = {
            version,
            updatedAt: new Date().toISOString().slice(0, 10),
            platforms: {
              android: { version, url: `${base}/teacher-workbench-android.apk`, force, notes: sourceNotes('android') },
              windows: { version, url: `${base}/teacher-workbench-windows.exe`, force, notes: sourceNotes('windows') },
              macos: { version, url: `${base}/teacher-workbench-macos.dmg`, force, notes: sourceNotes('macos') },
            },
          };
          const output = JSON.stringify(manifest, null, 2) + '\n';
          fs.writeFileSync('r2-assets/app-update.json', output);
          fs.writeFileSync(sourcePath, output);
          NODE

      - name: Set up Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Upload release files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler r2 bucket cors set fff --file teacher-workbench/worker/r2-cors.json --force
          wrangler r2 object put fff/teacher-workbench-windows.exe --file r2-assets/teacher-workbench-windows.exe --remote --content-type application/vnd.microsoft.portable-executable
          wrangler r2 object put fff/teacher-workbench-macos.dmg --file r2-assets/teacher-workbench-macos.dmg --remote --content-type application/x-apple-diskimage
          wrangler r2 object put fff/teacher-workbench-android.apk --file r2-assets/teacher-workbench-android.apk --remote --content-type application/vnd.android.package-archive
          wrangler r2 object put fff/app-update.json --file r2-assets/app-update.json --remote --content-type application/json

      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler pages deploy teacher-workbench/frontend --project-name fffenglish --branch main