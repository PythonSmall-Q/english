name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v3.0.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:dist:win
            artifact: desktop-windows
          - os: macos-latest
            script: desktop:dist:mac
            artifact: desktop-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/teacher-workbench-release.jks
          printf 'storeFile=teacher-workbench-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag }}
          name: 英语教师教学工作台 ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*