name = "teacher-workbench-api"
main = "src/index.js"
compatibility_date = "2026-09-11"

[[d1_databases]]
binding = "DB"
database_name = "teacher-workbench"
 database_id = "2f02d436-7621-4fbf-b673-25fbf42794ac" # Cloudflare D1 数据库 ID

migrations_dir = "migrations"

# 毕业归档库（GRAD_DB）：学年初结转时毕业班级全部数据压缩打包写入本库，
# 随后从主库删除该班数据。平台内不可查看任何内容，仅提供元数据列表与下载。
# database_id 先用占位符：用 npx wrangler d1 create teacher-workbench-graduated 创建后替换。
[[d1_databases]]
binding = "GRAD_DB"
database_name = "teacher-workbench-graduated"
database_id = "00000000-0000-0000-0000-000000000000"

migrations_dir = "grad-migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fff"

[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080,https://fff.xmoj-script.uk,https://fffsaas.is-a.bot"
PLATFORM_ADMIN_EMAILS = "seanoj_noreply@yeah.net"
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
# 文件公共分发端点（R2 自定义域名，上传后拼 key 即为下载 URL）
PUBLIC_FILE_BASE = "https://fff-file-r2-cloudflare.xmoj-script.uk"

[dev]
port = 8787

# 定时触发：
# - 每年北京时间 9 月 1 日凌晨 03:00（UTC 8 月 31 日 19:00）：学年初自动结转
#   （非毕业班级 academic_year 更新为新学年；毕业班整体归档到 GRAD_DB 并从主库删除）
# - 每年北京时间 10 月 1 日凌晨 03:00（UTC 9 月 30 日 19:00）：自动压缩归档
#   所有租户上一学年的默写/作业/考试数据到 year_archives，并删除对应明细行
[triggers]
schedules = ["0 19 30 9 *", "0 19 31 8 *"]
