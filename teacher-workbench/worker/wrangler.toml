name = "teacher-workbench-api"
main = "src/index.js"
compatibility_date = "2026-09-11"
workers_dev = true
preview_urls = true

routes = [
	{ pattern = "fff-api.xmoj-script.uk", zone_name = "xmoj-script.uk", custom_domain = true, enabled = true, previews_enabled = false }
]

[[d1_databases]]
binding = "DB"
database_name = "teacher-workbench"
database_id = "2f02d436-7621-4fbf-b673-25fbf42794ac" # Cloudflare D1 数据库 ID

migrations_dir = "migrations"

# 毕业归档库（GRAD_DB）：学年初结转时毕业班级全部数据压缩打包写入本库，
# 随后从主库删除该班数据。平台内不可查看任何内容，仅提供元数据列表与下载。
# database_id 先用占位符：用 npx wrangler d1 create teacher-workbench-graduated 创建后替换。
[[d1_databases]]
binding = "GRAD_DB"
database_name = "grad_db"
database_id = "6154a55e-5c4f-4a2c-857f-40029642aad0"

migrations_dir = "grad-migrations"

# 试用租户独立库（TRIAL_DB）：试用空间（plan='trial'）的租户行、成员关系、配额
# 与全部业务数据只存本库，主库 DB 不再存任何试用数据；users/sessions 等全局表
# 永远在主库。到期试用空间由每日 cron 在本库内物理删除。
[[d1_databases]]
binding = "TRIAL_DB"
database_name = "trialuser"
database_id = "631ee25e-3414-4a2c-b48e-9368db88cd5c"

migrations_dir = "trial-migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fff"

# Cloudflare Workers AI；未开通时 env.AI 为空，平台管理界面会显示未绑定
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080,https://localhost,https://fff.xmoj-script.uk,https://fffsaas.is-a.bot"
PLATFORM_ADMIN_EMAILS = "seanoj_noreply@yeah.net"
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
# 文件公共分发端点（R2 自定义域名，上传后拼 key 即为下载 URL）
PUBLIC_FILE_BASE = "https://fff-file-r2-cloudflare.xmoj-script.uk"

[dev]
port = 8787

[placement]
mode = "smart"

[observability.logs]
enabled = true

[observability.traces]
enabled = true

# 定时触发：
# - 每年北京时间 9 月 1 日凌晨 03:00（UTC 8 月 31 日 19:00）：学年初自动结转
#   （非毕业班级 academic_year 更新为新学年；毕业班整体归档到 GRAD_DB 并从主库删除）
# - 每年北京时间 10 月 1 日凌晨 03:00（UTC 9 月 30 日 19:00）：自动压缩归档
#   所有租户上一学年的默写/作业/考试数据到 year_archives，并删除对应明细行
# - 每日北京时间 03:12（UTC 19:12）：物理删除到期试用空间（plan='trial' 且
#   expires_at <= now 的租户全部数据，含 R2 文件对象与 tenants 行本身）
[triggers]
crons = ["0 19 30 9 *", "0 19 31 8 *", "12 19 * * *"]
