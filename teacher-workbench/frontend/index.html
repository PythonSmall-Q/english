<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle">英语教师教学工作台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 启动加载层：认证、刷新和首屏视图准备完成前显示默认动画；有品牌配置时由 App 替换动画图标 -->
  <div id="app-loading" class="app-loading" role="status" aria-label="加载中">
    <span class="default-loader" aria-hidden="true"></span>
  </div>

  <!-- 登录/注册屏（未认证时显示，由 auth.js 渲染） -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card card" id="startup-fallback">
      <div class="auth-logo">英语教师教学工作台</div>
      <p class="muted" style="text-align:center">正在启动应用 / Starting application...</p>
      <button class="btn btn-primary btn-block" type="button" onclick="location.reload()">重试 / Retry</button>
    </div>
  </div>

  <!-- 应用主框架（认证后显示） -->
  <div id="app-frame" class="app-frame hidden">
    <aside class="sidebar">
      <div class="sidebar-user">
        <div class="avatar">L</div>
        <div class="sidebar-user-name">Lynn</div>
        <div class="sidebar-user-sub">英语</div>
      </div>
      <!-- 商议版品牌：校徽 + 校训（平台管理员配置后显示） -->
      <div id="sidebar-brand" class="sidebar-brand hidden"></div>
      <nav class="nav">
        <a class="nav-item" data-view="dashboard"><span class="nav-ico">🏠</span> <span data-i18n="home">工作台首页</span></a>
        <a class="nav-item" data-view="classes"><span class="nav-ico">🏫</span> <span data-i18n="classes">我的班级</span></a>
        <a class="nav-item" data-view="lessons"><span class="nav-ico">📚</span> <span data-i18n="lessons">备课中心</span></a>
        <a class="nav-item" data-view="schedule"><span class="nav-ico">📅</span> <span data-i18n="schedule">教学课表</span></a>
        <a class="nav-item" data-view="students"><span class="nav-ico">👥</span> <span data-i18n="students">学生管理</span></a>
        <a class="nav-item" data-view="assignments"><span class="nav-ico">📝</span> <span data-i18n="assignments">作业统计</span></a>
        <a class="nav-item" data-view="dictations"><span class="nav-ico">✏️</span> <span data-i18n="dictations">默写管理</span></a>
        <a class="nav-item" data-view="exams"><span class="nav-ico">📊</span> <span data-i18n="exams">考试成绩</span></a>
        <a class="nav-item" data-view="todos"><span class="nav-ico">📋</span> <span data-i18n="todos">待办中心</span></a>
        <a class="nav-item" data-view="ai"><span class="nav-ico">🤖</span> <span data-i18n="ai">AI 教学助手</span></a>
        <a class="nav-item" data-view="recycle"><span class="nav-ico">🗑</span> <span data-i18n="recycle">回收站</span></a>
        <a class="nav-item" data-view="settings"><span class="nav-ico">⚙️</span> <span data-i18n="settings">设置</span></a>
        <!-- 仅 platform_admin 可见（§72），默认隐藏，App.enterApp 控制 -->
        <a class="nav-item hidden" data-view="admin" id="nav-admin"><span class="nav-ico">🛡️</span> <span data-i18n="admin">平台管理</span></a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-block" id="logout-btn" type="button" data-i18n="logout">退出登录</button>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb" data-i18n="home">工作台首页</div>
        <div class="topbar-right">
          <!-- 白天/黑夜模式切换（本机记忆） -->
          <button type="button" id="theme-toggle" class="theme-toggle" title="切换黑夜/白天模式">🌙</button>
          <!-- 身份查看（仅平台管理员）：选择以某成员身份查看与管理本空间 -->
          <div id="viewas-switcher" class="tenant-switcher hidden">
            <select id="viewas-select" class="viewas-select" aria-label="以成员身份查看">
              <option value="">本人身份</option>
            </select>
          </div>
          <!-- 学年切换器：自定义下拉（复用 ts-* 样式），登录后加载学年列表时显示 -->
          <div id="year-switcher" class="tenant-switcher hidden">
            <button type="button" id="ys-btn" class="ts-btn">
              <span class="ts-icon" id="ys-icon">🗓️</span>
              <span class="ts-name" id="ys-name">当前学年</span>
              <svg class="ts-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="ys-menu" class="ts-menu hidden"></div>
          </div>
          <!-- 租户切换器（§22/§69）：自定义下拉，>1 个空间时显示 -->
          <div id="tenant-switcher" class="tenant-switcher hidden">
            <button type="button" id="ts-btn" class="ts-btn">
              <span class="ts-icon" id="ts-icon">🏠</span>
              <span class="ts-name" id="ts-name">我的空间</span>
              <svg class="ts-caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="ts-menu" class="ts-menu hidden"></div>
          </div>
        </div>
      </header>
      <!-- 身份查看提示条（平台管理员以成员身份查看时显示，app.js 控制） -->
      <div id="viewas-banner" class="year-banner hidden"></div>
      <!-- 历史学年只读提示条（查看历史学年时显示，app.js 控制） -->
      <div id="year-banner" class="year-banner hidden"></div>
      <main id="view-container" class="view-container"></main>
    </div>
  </div>

  <!-- 弹窗 / 轻提示容器 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    // Keep a visible recovery surface even when a later script cannot load.
    window.__startupFallbackTimer = setTimeout(function () {
      var loading = document.getElementById('app-loading');
      var auth = document.getElementById('auth-screen');
      if (loading) loading.classList.add('is-hidden');
      if (auth) auth.classList.remove('hidden');
    }, 8000);
  </script>

  <!-- 全局框架先加载（创建 window.App），视图文件随后注册 -->
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="landing.js"></script>
  <script src="dict.js"></script>
  <!-- SheetJS（xlsx 解析）不全局加载：约 950KB 会阻塞首屏；
       各视图在真正需要导入/导出 xlsx 时才懒加载 vendor/xlsx.full.min.js -->

  <!-- 13 个视图全部按需懒加载（App.ensureView），首屏只带框架脚本 -->
</body>
</html>
